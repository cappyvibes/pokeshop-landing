<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokeLovers – Panel Admina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ── Podstawa – styl spójny z landing page ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: #0a0e1a;
      color: #c8d0e0;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0e1a; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(to bottom,#c8900a,#f0c040); border-radius: 3px; }

    /* ── EKRAN LOGOWANIA ── */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(240,192,64,0.07) 0%, transparent 70%),
        #0a0e1a;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: #0f1526;
      border: 1px solid rgba(240,192,64,0.2);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .login-logo {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      background: linear-gradient(90deg,#f0c040,#fff,#f0c040);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      margin-bottom: 0.25rem;
    }
    .login-sub {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(240,192,64,0.5);
      text-align: center;
      margin-bottom: 2rem;
    }

    /* ── Inputy ── */
    .field-label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6b7a99;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .field-input {
      width: 100%;
      background: rgba(10,14,26,0.8);
      border: 1px solid rgba(240,192,64,0.15);
      border-radius: 8px;
      padding: 12px 16px;
      color: #c8d0e0;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 1rem;
    }
    .field-input:focus { border-color: rgba(240,192,64,0.5); }
    .field-input::placeholder { color: #2a3050; }

    /* ── Przyciski ── */
    .btn-gold {
      width: 100%;
      background: #f0c040;
      color: #0a0e1a;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 13px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .btn-gold:hover {
      background: #f7d96a;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(240,192,64,0.35);
    }
    .btn-gold:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-sm {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-outline-sm {
      background: transparent;
      border: 1px solid rgba(240,192,64,0.3);
      color: #f0c040;
    }
    .btn-outline-sm:hover { border-color: #f0c040; background: rgba(240,192,64,0.08); }
    .btn-danger-sm {
      background: rgba(224,48,48,0.12);
      border: 1px solid rgba(224,48,48,0.3);
      color: #e05050;
    }
    .btn-danger-sm:hover { background: rgba(224,48,48,0.2); border-color: #e05050; }

    /* ── Komunikat błędu logowania ── */
    .login-error {
      display: none;
      background: rgba(224,48,48,0.1);
      border: 1px solid rgba(224,48,48,0.3);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 13px;
      color: #e05050;
      margin-bottom: 1rem;
      text-align: center;
    }

    /* ── DASHBOARD ── */
    .dashboard { display: none; min-height: 100vh; }

    /* Topbar */
    .topbar {
      background: rgba(10,14,26,0.95);
      border-bottom: 1px solid rgba(240,192,64,0.15);
      padding: 0 2rem;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
    }
    .topbar-logo {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #f0c040;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .topbar-email {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: #6b7a99;
    }
    .btn-logout {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid rgba(240,192,64,0.25);
      color: #f0c040;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-logout:hover { border-color: #f0c040; background: rgba(240,192,64,0.08); }

    /* Zawartość */
    .dashboard-content { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* ── Statystyki ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: #0f1526;
      border: 1px solid rgba(240,192,64,0.12);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: border-color 0.2s;
    }
    .stat-card:hover { border-color: rgba(240,192,64,0.3); }
    .stat-icon {
      width: 44px; height: 44px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .stat-icon.new       { background: rgba(240,192,64,0.12); }
    .stat-icon.progress  { background: rgba(64,160,240,0.12); }
    .stat-icon.closed    { background: rgba(80,200,120,0.12); }
    .stat-number {
      font-family: 'Space Mono', monospace;
      font-size: 1.8rem;
      font-weight: 700;
      color: #e8eaf0;
      line-height: 1;
    }
    .stat-number.new      { color: #f0c040; }
    .stat-number.progress { color: #40a0f0; }
    .stat-number.closed   { color: #50c878; }
    .stat-label {
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #6b7a99;
      margin-top: 3px;
    }

    /* ── Filtry ── */
    .filters-bar {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .filter-chip {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 7px 16px;
      border-radius: 20px;
      border: 1px solid rgba(240,192,64,0.2);
      background: transparent;
      color: #6b7a99;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-chip:hover { border-color: rgba(240,192,64,0.4); color: #f0c040; }
    .filter-chip.active { background: rgba(240,192,64,0.12); border-color: #f0c040; color: #f0c040; }
    .filters-count {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: #3a4566;
      margin-left: auto;
    }

    /* ── Tabela zapytań ── */
    .inquiries-table {
      background: #0f1526;
      border: 1px solid rgba(240,192,64,0.1);
      border-radius: 16px;
      overflow: hidden;
    }
    .table-header {
      display: grid;
      grid-template-columns: 140px 1fr 1fr 80px 130px 100px;
      padding: 0.85rem 1.25rem;
      background: rgba(240,192,64,0.05);
      border-bottom: 1px solid rgba(240,192,64,0.1);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6b7a99;
      font-weight: 600;
    }
    .inquiry-row {
      display: grid;
      grid-template-columns: 140px 1fr 1fr 80px 130px 100px;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      align-items: start;
      transition: background 0.15s;
      gap: 0.5rem;
    }
    .inquiry-row:last-child { border-bottom: none; }
    .inquiry-row:hover { background: rgba(240,192,64,0.03); }

    .inquiry-date {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: #6b7a99;
      line-height: 1.5;
    }
    .inquiry-name { font-weight: 600; color: #e8eaf0; font-size: 14px; }
    .inquiry-email { font-family: 'Space Mono', monospace; font-size: 11px; color: #6b7a99; margin-top: 2px; }
    .inquiry-message { font-size: 13px; color: #8a9ab8; line-height: 1.5; }
    .inquiry-card-name {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: #f0c040;
      background: rgba(240,192,64,0.08);
      border: 1px solid rgba(240,192,64,0.15);
      border-radius: 4px;
      padding: 2px 6px;
      display: inline-block;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* Status badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .status-badge.new         { background: rgba(240,192,64,0.12); color: #f0c040; border: 1px solid rgba(240,192,64,0.3); }
    .status-badge.in_progress { background: rgba(64,160,240,0.12); color: #40a0f0; border: 1px solid rgba(64,160,240,0.3); }
    .status-badge.closed      { background: rgba(80,200,120,0.12); color: #50c878; border: 1px solid rgba(80,200,120,0.3); }

    /* Select status */
    .status-select {
      background: #0a0e1a;
      border: 1px solid rgba(240,192,64,0.2);
      border-radius: 6px;
      padding: 5px 8px;
      color: #c8d0e0;
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      outline: none;
      width: 100%;
      margin-bottom: 6px;
    }
    .status-select:focus { border-color: rgba(240,192,64,0.5); }

    /* Akcje */
    .actions-col { display: flex; flex-direction: column; gap: 5px; }

    /* Empty state */
    .empty-state {
      padding: 4rem 2rem;
      text-align: center;
    }
    .empty-state-icon { font-size: 3rem; opacity: 0.3; margin-bottom: 1rem; }
    .empty-state-text { color: #3a4566; font-size: 14px; }

    /* Loading spinner */
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(240,192,64,0.2);
      border-top-color: #f0c040;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem; right: 2rem;
      background: #0f1526;
      border: 1px solid rgba(240,192,64,0.3);
      border-radius: 10px;
      padding: 0.85rem 1.25rem;
      font-size: 13px;
      font-weight: 600;
      color: #f0c040;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      z-index: 999;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { border-color: rgba(224,48,48,0.4); color: #e05050; }

    /* Mobile */
    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: 1fr; }
      .table-header { display: none; }
      .inquiry-row {
        grid-template-columns: 1fr;
        gap: 0.5rem;
        padding: 1.25rem;
      }
      .inquiry-row > * { grid-column: 1; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════
     EKRAN LOGOWANIA
═══════════════════════════════════ -->
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="login-logo">PokeLovers</div>
    <div class="login-sub">Panel Administracyjny</div>

    <div class="login-error" id="login-error"></div>

    <div>
      <label class="field-label">Email</label>
      <input type="email" id="login-email" class="field-input"
             placeholder="admin@poke-lovers.pl"
             onkeydown="if(event.key==='Enter') handleLogin()" />

      <label class="field-label">Hasło</label>
      <input type="password" id="login-password" class="field-input"
             placeholder="••••••••••"
             onkeydown="if(event.key==='Enter') handleLogin()" />

      <button class="btn-gold" id="login-btn" onclick="handleLogin()">
        Zaloguj się
      </button>
    </div>

    <p style="text-align:center; margin-top:1.25rem; font-size:12px; color:#3a4566;">
      Tylko dla właściciela sklepu
    </p>
  </div>
</div>


<!-- ═══════════════════════════════════
     DASHBOARD (widoczny po zalogowaniu)
═══════════════════════════════════ -->
<div class="dashboard" id="dashboard">

  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-logo">🃏 PokeLovers Admin</div>
    <div class="topbar-right">
      <span class="topbar-email" id="user-email"></span>
      <button class="btn-logout" onclick="handleLogout()">Wyloguj</button>
    </div>
  </div>

  <div class="dashboard-content">

    <!-- Statystyki -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <div class="stat-icon new">🆕</div>
        <div>
          <div class="stat-number new" id="stat-new">–</div>
          <div class="stat-label">Nowe zapytania</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon progress">⏳</div>
        <div>
          <div class="stat-number progress" id="stat-progress">–</div>
          <div class="stat-label">W trakcie</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon closed">✅</div>
        <div>
          <div class="stat-number closed" id="stat-closed">–</div>
          <div class="stat-label">Zamknięte</div>
        </div>
      </div>
    </div>

    <!-- Filtry -->
    <div class="filters-bar">
      <button class="filter-chip active" onclick="setFilter('all', this)">Wszystkie</button>
      <button class="filter-chip" onclick="setFilter('new', this)">🆕 Nowe</button>
      <button class="filter-chip" onclick="setFilter('in_progress', this)">⏳ W trakcie</button>
      <button class="filter-chip" onclick="setFilter('closed', this)">✅ Zamknięte</button>
      <button class="btn-sm btn-outline-sm" onclick="loadInquiries()" style="margin-left:auto;">
        ↻ Odśwież
      </button>
    </div>

    <!-- Tabela -->
    <div class="inquiries-table">
      <div class="table-header">
        <span>Data</span>
        <span>Klient</span>
        <span>Wiadomość</span>
        <span>Karta</span>
        <span>Status</span>
        <span>Akcje</span>
      </div>
      <div id="inquiries-list">
        <!-- Wypełniane przez JS -->
        <div class="empty-state">
          <div class="spinner"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Toast powiadomień -->
<div class="toast" id="toast"></div>


<!-- ═══════════════════════════════════
     JAVASCRIPT
═══════════════════════════════════ -->
<script>
  /* ══════════════════════════════════════════
     KONFIGURACJA SUPABASE
     Podmień poniższe wartości na swoje:
     1. SUPABASE_URL → Supabase → Settings → API → Project URL
     2. SUPABASE_ANON_KEY → Settings → API → anon public
  ══════════════════════════════════════════ */
  const SUPABASE_URL      = 'https://exqsahakhoonrlqhphdg.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4cXNhaGFraG9vbnJscWhwaGRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMDIzMzYsImV4cCI6MjA5Mzg3ODMzNn0.rAURIDEfnc4ZrbRI-QyaHnvYRmlU7w0UibYquleMyrA';

  /* Inicjalizacja klienta */
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /* Stan aplikacji */
  let currentFilter = 'all';
  let allInquiries  = [];

  /* ── TOAST ── */
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className   = 'toast' + (isError ? ' error' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  /* ── LOGOWANIE ── */
  async function handleLogin() {
    const email    = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const btn      = document.getElementById('login-btn');
    const errEl    = document.getElementById('login-error');

    if (!email || !password) {
      errEl.textContent = 'Wpisz email i hasło.';
      errEl.style.display = 'block';
      return;
    }

    btn.textContent = 'Logowanie...';
    btn.disabled    = true;
    errEl.style.display = 'none';

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      errEl.textContent   = 'Błąd logowania: ' + (error.message === 'Invalid login credentials'
        ? 'Nieprawidłowy email lub hasło.' : error.message);
      errEl.style.display = 'block';
      btn.textContent     = 'Zaloguj się';
      btn.disabled        = false;
    } else {
      showDashboard(data.user);
    }
  }

  /* ── WYLOGOWANIE ── */
  async function handleLogout() {
    await sb.auth.signOut();
    document.getElementById('dashboard').style.display    = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('login-password').value       = '';
  }

  /* ── POKAŻ DASHBOARD ── */
  function showDashboard(user) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display    = 'block';
    document.getElementById('user-email').textContent     = user.email;
    loadInquiries();
  }

  /* ── WCZYTAJ ZAPYTANIA ── */
  async function loadInquiries() {
    document.getElementById('inquiries-list').innerHTML =
      '<div class="empty-state"><div class="spinner"></div></div>';

    const { data, error } = await sb
      .from('inquiries')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      showToast('Błąd wczytywania: ' + error.message, true);
      return;
    }

    allInquiries = data || [];
    updateStats();
    renderInquiries();
  }

  /* ── STATYSTYKI ── */
  function updateStats() {
    document.getElementById('stat-new').textContent =
      allInquiries.filter(i => i.status === 'new').length;
    document.getElementById('stat-progress').textContent =
      allInquiries.filter(i => i.status === 'in_progress').length;
    document.getElementById('stat-closed').textContent =
      allInquiries.filter(i => i.status === 'closed').length;
  }

  /* ── FILTR ── */
  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    renderInquiries();
  }

  /* ── RENDERUJ LISTĘ ── */
  function renderInquiries() {
    const list = document.getElementById('inquiries-list');
    const filtered = currentFilter === 'all'
      ? allInquiries
      : allInquiries.filter(i => i.status === currentFilter);

    if (filtered.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <div class="empty-state-text">
            ${currentFilter === 'all'
              ? 'Brak zapytań. Gdy klient wypełni formularz — pojawi się tutaj.'
              : 'Brak zapytań w tej kategorii.'}
          </div>
        </div>`;
      return;
    }

    list.innerHTML = filtered.map(inq => {
      const date = new Date(inq.created_at);
      const dateStr = date.toLocaleDateString('pl-PL', {
        day: '2-digit', month: '2-digit', year: 'numeric'
      });
      const timeStr = date.toLocaleTimeString('pl-PL', {
        hour: '2-digit', minute: '2-digit'
      });

      const statusLabels = {
        new:         '🆕 Nowe',
        in_progress: '⏳ W trakcie',
        closed:      '✅ Zamknięte',
      };
      const statusClass = inq.status || 'new';

      return `
        <div class="inquiry-row" id="row-${inq.id}">

          <!-- Data -->
          <div class="inquiry-date">
            ${dateStr}<br/>${timeStr}
          </div>

          <!-- Klient -->
          <div>
            <div class="inquiry-name">${escHtml(inq.name)}</div>
            <div class="inquiry-email">${escHtml(inq.email)}</div>
            ${inq.subject
              ? `<div style="font-size:11px;color:#3a4566;margin-top:3px;font-family:'Space Mono',monospace;">
                   Temat: ${escHtml(inq.subject)}
                 </div>`
              : ''}
          </div>

          <!-- Wiadomość -->
          <div class="inquiry-message">
            ${escHtml(inq.message)}
          </div>

          <!-- Karta -->
          <div>
            ${inq.card_name
              ? `<span class="inquiry-card-name" title="${escHtml(inq.card_name)}">
                   ${escHtml(inq.card_name)}
                 </span>`
              : '<span style="color:#2a3050;font-size:11px;">–</span>'}
          </div>

          <!-- Status -->
          <div>
            <select class="status-select" onchange="updateStatus('${inq.id}', this.value)">
              <option value="new"         ${inq.status==='new'?'selected':''}>🆕 Nowe</option>
              <option value="in_progress" ${inq.status==='in_progress'?'selected':''}>⏳ W trakcie</option>
              <option value="closed"      ${inq.status==='closed'?'selected':''}>✅ Zamknięte</option>
            </select>
            <span class="status-badge ${statusClass}">${statusLabels[statusClass]}</span>
          </div>

          <!-- Akcje -->
          <div class="actions-col">
            <button class="btn-sm btn-danger-sm"
                    onclick="deleteInquiry('${inq.id}', '${escHtml(inq.name)}')">
              🗑 Usuń
            </button>
          </div>

        </div>`;
    }).join('');
  }

  /* ── ZMIEŃ STATUS ── */
  async function updateStatus(id, newStatus) {
    const { error } = await sb
      .from('inquiries')
      .update({ status: newStatus })
      .eq('id', id);

    if (error) {
      showToast('Błąd zmiany statusu.', true);
      return;
    }

    /* Zaktualizuj lokalny stan bez przeładowania */
    const inq = allInquiries.find(i => i.id === id);
    if (inq) inq.status = newStatus;
    updateStats();
    showToast('Status zaktualizowany ✓');
  }

  /* ── USUŃ ZAPYTANIE ── */
  async function deleteInquiry(id, name) {
    if (!confirm(`Usunąć zapytanie od "${name}"?\nTej operacji nie można cofnąć.`)) return;

    const { error } = await sb
      .from('inquiries')
      .delete()
      .eq('id', id);

    if (error) {
      showToast('Błąd usuwania.', true);
      return;
    }

    allInquiries = allInquiries.filter(i => i.id !== id);
    updateStats();
    renderInquiries();
    showToast(`Usunięto zapytanie od ${name}`);
  }

  /* ── ESCAPE HTML (zabezpieczenie XSS) ── */
  function escHtml(str) {
    if (!str) return '';
    return str
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  /* ── SPRAWDŹ SESJĘ przy starcie ── */
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      showDashboard(session.user);
    }
  })();

  /* ── Nasłuchuj zmian sesji (auto-logout po wygaśnięciu) ── */
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') {
      document.getElementById('dashboard').style.display    = 'none';
      document.getElementById('login-screen').style.display = 'flex';
    }
  });
</script>

</body>
</html>
